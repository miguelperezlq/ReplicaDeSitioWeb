<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>justinasoulas.com.ar</title>
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/contacto.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body class="page">
    <header class="header">
        <!-- Barra superior -->
        <div class="header__top">
            <div class="left">
                <a class="left__link" href="#">Crear cuenta</a>|
                <a class="left__link" href="#">Iniciar sesion</a>
            </div>
            <div class="right">
                <a class="right__link" href="#"><img class="right__link--icono" src="img/buscar.png" alt="facebook"></a>
                <a class="right__link" href="#"><img class="right__link--icono" src="img/carrito.png" alt="facebook"></a>
                <a class="right__link" href="https://www.facebook.com/justisoulas"><img class="right__link--icono" src="img/facebook.png" alt="facebook"></a>
                <a class="right__link" href="https://www.instagram.com/justina.soulas"><img class="right__link--icono" src="img/instagram.png" alt="instagram"></a>
            </div>
        </div>
        <!-- Logo -->
        <div class="logo">
            <h1 class="logo__title">JUSTINA SOULAS</h1>
            <p class="logo_description">FOTOGRAFIA</p>
        </div>
        <!-- menu -->
        <input type="checkbox" id="check">
        <label for="check" class="checkbtn">
            ≡
        </label>
        <nav class="menu">
            <ul class="menu__list">
                <li><a class="menu__link" href="index.html">INICIO</a></li>
                <li><a class="menu__link" href="productos.html">PRODUCTOS</a></li>
                <li><a class="menu__link" href="comoComprar.html">COMO COMPRAR</a></li>
                <li><a class="menu__link" href="tutoriales.html">TUTORIALES</a></li>
                <li><a class="menu__link" href="contacto.html">CONTACTO</a></li>
            </ul>
        </nav>
    </header>
    <!-- Contacto -->
    <div class="formulario">
        <div class="formulario__header">
            <h2>Contacto</h2>
        </div>
        <form class="contact__form">
            <label for="nombre">Nombre completo</label>
            <input type="text" id="nombre" name="nombre" required>
            <div class="row">
                <div class="col">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="col">
                    <label for="telefono">Telefono (opcional)</label>
                    <input type="tel" id="telefono" name="telefono">
                </div>
            </div>
            <label for="mensaje">Mensaje</label>
            <textarea name="mensaje" id="mensaje" rows="4" required></textarea>

            <button class="contact__form--boton" type="submit">Enviar</button>
        </form>
    </div>


    <!-- Footer -->
    <footer class="footer">
        <!-- Sección inferior con medios de pago y contacto -->
        <section class="footer__info">
            <div class="info__column info__column--wide">
                <h4>MEDIOS DE PAGO</h4>
                <div class="medios__img">
                    <!-- medios de pago -->
                    <img src="img/uala.png" alt="uala" />
                    <img src="img/mercadopago.png" alt="Mercado pago" />
                    <img src="img/mastercard.png" alt="mastercard" />
                    <img src="img/visa.png" alt="visa" />
                    <img src="img/american-express.png" alt="american-express" />
                    <img src="img/naranja.png" alt="naranja" />
                    <img src="img/cabal.png" alt="cabal" />
                    <img src="img/maestro.png" alt="maestro" />
                    <img src="img/diners-club.png" alt="diners-club" />
                    <img src="img/nativa.png" alt="nativa" />
                    <img src="img/argencard.png" alt="argencard" />
                    <img src="img/mercadopago.png" alt="mercadopago" />
                    <img src="img/deposito.png" alt="deposito" />
                    <!-- etc. -->
                </div>

                <h4>MEDIOS DE ENVIO</h4>
                <div class="medios__img">
                    <img src="img/personalizado.png" alt="Envío" />
                </div>
            </div>

            <div class="info__column info__column--narrow">
                <h4>NUESTRAS REDES SOCIALES</h4>
                <div class="social__icons">
                    <a href="https://www.facebook.com/justisoulas"><i class="fab fa-facebook-f"></i></a>
                    <a href="https://www.instagram.com/justina.soulas"><i class="fab fa-instagram"></i></a>
                </div>

                <h4>CONTACTO</h4>
                <p><i class="fas fa-envelope"></i> foxersdesignz@gmail.com</p>
                <p><i class="fas fa-arrow-right"></i> <a class="fas__link" href="#">Botón de arrepentimiento</a></p>

                <h4>NEWSLETTER</h4>
                <div class="newsletter">
                    <input type="email" id="email" placeholder="Email">
                    <button type="submit">SUSCRIBIRME</button>
                </div>

            </div>
        </section>

        <div class="footer__bottom">
            <p>Tienda creada con <strong>empretienda</strong></p>
        </div>

    </footer>
</body>

</html>
